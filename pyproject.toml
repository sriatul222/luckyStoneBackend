[project]
name = "luckystone-backend"
version = "1.0.0"
description = "FastAPI + PostgreSQL backend for the Lucky Stone jewellery shopping app."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "email-validator>=2.1.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2",
    "python-dotenv>=1.0.0",
    "PyJWT>=2.9.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
